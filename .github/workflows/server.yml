# Checks for the server (apps/server). Same flow as client.yml's check job.
# No Worker Preview job yet: the server needs its secrets and a real R2 bucket first.
# TODO(R2 media bucket, server secrets): add a preview job like client.yml's once they exist.
name: server

on:
  push:
    branches: [main]
    paths: ["apps/server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["apps/server/**", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The Worker bundle, as `wrangler deploy` builds it, without deploying
      - run: npx wrangler deploy --dry-run --outdir dist
