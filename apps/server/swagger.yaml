# TCOS Portfolio API, written by hand. Served by Swagger UI at /api/docs (local dev).
# Follows docs/API.md "Response shapes" and apps/client/types/api.ts:
# change docs/API.md first (with approval), then this file.

openapi: 3.1.0
info:
  title: TCOS Portfolio API
  version: 0.1.0
  description: |
    The server behind the TCOS portfolio site. Source of truth: `docs/API.md`.

    **For the client (Next.js):**
    - Call the public API only from the Next.js server, through `lib/api.ts`. The browser never calls this server.
    - Types are in `apps/client/types/api.ts` and match the schemas below.
    - The body is the data itself, no wrapper. Errors are `{ "error": "<message>" }` with the status code.
    - `404` means hidden or missing: call `notFound()`.
    - Dates are ISO 8601 strings. Optional fields arrive as `null` (or `[]` for lists).
    - Only shown data is ever sent, so there are no `is_shown` flags, no `_id`s, and nothing to filter in the client.
    - `photo` is `null` unless the person allowed it; `logo` is `null` unless the sponsor allowed it.

servers:
  - url: /
    description: This server

tags:
  - name: Health
    description: Is the server up and can it reach the database
  - name: Public
    description: Read-only, no token. Used by the Next.js client.
  - name: Admin
    description: 'Needs `Authorization: Bearer <token>`. Never called from the client. See docs/API.md "Admin API" (tasks S5–S8).'

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Server and database check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                  db: { const: ok }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/pages/home:
    get:
      tags: [Public]
      summary: "Home page: title and shown blocks, data blocks filled in"
      description: "Every data block arrives filled in (see Block)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [key, title, blocks]
                properties:
                  key: { type: string }
                  title: { type: string }
                  blocks: { type: array, items: { $ref: "#/components/schemas/Block" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects:
    get:
      tags: [Public]
      summary: Project bookshelf, newest first by start_date
      description: |
        The year filter and the reverse toggle run in the client.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProjectCard" } }

  /api/projects/{slug}:
    get:
      tags: [Public]
      summary: "Project page: fixed header and blocks"
      description: "Every data block arrives filled in (see Block)."
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  name: { type: string }
                  start_date: { $ref: "#/components/schemas/Date" }
                  end_date: { $ref: "#/components/schemas/DateOrNull" }
                  venue: { type: [string, "null"] }
                  pics: { $ref: "#/components/schemas/OnePic" }
                  is_yearbook_shown: { type: boolean }
                  blocks: { type: array, items: { $ref: "#/components/schemas/Block" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{slug}/yearbook:
    get:
      tags: [Public]
      summary: "Yearbook: shown team grouped by department"
      description: |
        Departments sorted by `dept_name`; members keep their order.
        `404` also when the project's yearbook is not shown.
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  name: { type: string }
                  pics: { $ref: "#/components/schemas/OnePic" }
                  departments: { type: array, items: { $ref: "#/components/schemas/Department" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tracks:
    get:
      tags: [Public]
      summary: Tracks (สายงาน) list, by order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    display_name: { type: string }
                    desc: { type: [string, "null"] }

  /api/tracks/{key}:
    get:
      tags: [Public]
      summary: Track popup
      description: |
        Achievements of hidden projects are left out.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, description: tracks.key }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  display_name: { type: string }
                  desc: { type: [string, "null"] }
                  pics: { type: array, items: { type: string, format: uri } }
                  achievements:
                    type: array
                    items:
                      type: object
                      properties:
                        year: { type: [integer, "null"] }
                        text: { type: string }
                        pics: { type: array, items: { type: string, format: uri } }
                        project_name: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/join:
    get:
      tags: [Public]
      summary: Open recruitment rounds, closing soonest first
      description: |
        Open = opens_at ≤ now ≤ (extended_to or closes_at). `[]` when none is open.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Round" } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Hand-made JWT signed with JWT_SECRET (task S5). Never paste a real token into shared files or chat.

  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      example: tcos-2-the-hidden-saloon

  responses:
    NotFound:
      description: Hidden or missing
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The database cannot be reached
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Date: { type: string, format: date-time, example: "2025-06-28T00:00:00.000Z" }
    DateOrNull: { type: [string, "null"], format: date-time }
    OnePic:
      type: array
      items: { type: string, format: uri }
      maxItems: 1
      description: "At most one item: pics[0]. `[]` when there is none."

    ProjectCard:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        start_date: { $ref: "#/components/schemas/Date" }
        pics: { $ref: "#/components/schemas/OnePic" }

    TrackCard:
      type: object
      properties:
        key: { type: string }
        display_name: { type: string }
        desc: { type: [string, "null"] }
        pics: { $ref: "#/components/schemas/OnePic" }

    YearbookCard:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        pics: { $ref: "#/components/schemas/OnePic" }

    Member:
      type: object
      properties:
        name: { type: string }
        nickname: { type: [string, "null"] }
        position: { type: string }
        photo: { type: [string, "null"], format: uri, description: null unless the person allowed their photo }

    Department:
      type: object
      properties:
        dept_key: { type: string }
        dept_name: { type: [string, "null"] }
        members: { type: array, items: { $ref: "#/components/schemas/Member" } }

    Sponsor:
      type: object
      properties:
        name: { type: string }
        logo: { type: [string, "null"], format: uri, description: null unless logo permission }
        tier: { type: [string, "null"] }

    Highlight:
      type: object
      properties:
        event_name: { type: string }
        date: { $ref: "#/components/schemas/DateOrNull" }
        venue: { type: [string, "null"] }
        desc: { type: [string, "null"] }
        pics: { type: array, items: { type: string, format: uri } }

    Position:
      type: object
      properties:
        dept_key: { type: string }
        dept_name: { type: [string, "null"] }
        unit_name: { type: [string, "null"] }
        title: { type: string }
        description: { type: [string, "null"] }
        requirements: { type: array, items: { type: string } }
        portfolio_required: { type: [boolean, "null"] }
        onsite_required: { type: [boolean, "null"] }
        audition:
          type: [object, "null"]
          properties:
            clip_required: { type: [boolean, "null"] }
            clip_brief: { type: [string, "null"] }
            clip_max_minutes: { type: [integer, "null"] }
            clip_file_name: { type: [string, "null"] }
            clip_upload: { type: [string, "null"] }
            pieces: { type: array, items: { type: string } }
            onsite: { type: [boolean, "null"] }

    TimelineEvent:
      type: object
      properties:
        start_date: { $ref: "#/components/schemas/Date" }
        end_date: { $ref: "#/components/schemas/DateOrNull" }
        event_name: { type: string }
        event_description: { type: [string, "null"] }
        location: { type: [string, "null"], description: null = online }

    Round:
      type: object
      properties:
        title: { type: string }
        poster: { type: [string, "null"], format: uri }
        opens_at: { $ref: "#/components/schemas/Date" }
        closes_at: { $ref: "#/components/schemas/Date" }
        extended_to: { $ref: "#/components/schemas/DateOrNull" }
        qualifications:
          type: object
          properties:
            age_min: { type: [integer, "null"] }
            age_max: { type: [integer, "null"] }
            age_note: { type: [string, "null"] }
            items: { type: array, items: { type: string } }
        positions: { type: array, items: { $ref: "#/components/schemas/Position" } }
        timeline: { type: array, items: { $ref: "#/components/schemas/TimelineEvent" } }
        apply_url: { type: [string, "null"], format: uri }
        project_name: { type: [string, "null"], description: The project's name; null when the round has no project }

    Block:
      type: object
      required: [id, type]
      additionalProperties: true
      description: |
        Every block keeps its stored fields (`id`, `type`, `title` and its own). Content blocks arrive as stored.
        Data blocks get one extra key with their data:
        - `projects` → `projects: ProjectCard[]`
        - `tracks` → `tracks: TrackCard[]`
        - `yearbook` → `projects: YearbookCard[]`
        - `join` → `rounds: Round[]`
        - `team` → `departments: Department[]` and `org_chart_image` (null unless `show_org_chart`)
        - `sponsors` → `sponsors: Sponsor[]`
        - `highlights` → `highlights: Highlight[]`

        `project_slug: null` means this project on a project page, and all shown projects on Home.
        A named project that is hidden or missing gives empty lists.

        The client skips types it does not know.
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: [string, "null"] }
