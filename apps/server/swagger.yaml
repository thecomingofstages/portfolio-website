# TCOS Portfolio API, written by hand. Served by Swagger UI at /api/docs (local dev).
# Follows docs/API.md "Response shapes" and apps/client/types/api.ts:
# change docs/API.md first (with approval), then this file.

openapi: 3.1.0
info:
  title: TCOS Portfolio API
  version: 0.1.0
  description: |
    The server behind the TCOS portfolio site. Source of truth: `docs/API.md`.

    **For the client (Next.js):**
    - Call the public API only from the Next.js server, through `lib/api.ts`. The browser never calls this server.
    - Types are in `apps/client/types/api.ts` and match the schemas below.
    - The body is the data itself, no wrapper. Errors are `{ "error": "<message>" }` with the status code.
    - `404` means hidden or missing: call `notFound()`.
    - Dates are ISO 8601 strings. Optional fields arrive as `null` (or `[]` for lists).
    - Only shown data is ever sent, so there are no `is_shown` flags, no `_id`s, and nothing to filter in the client.
    - `photo` is `null` unless the person allowed it; `logo` is `null` unless the sponsor allowed it.

servers:
  - url: /
    description: This server

tags:
  - name: Health
    description: Is the server up and can it reach the database
  - name: Public
    description: Read-only, no token. Used by the Next.js client.
  - name: Admin
    description: |
      Needs `Authorization: Bearer <token>` (task S5). Never called from the client. See docs/API.md "Admin API".
      Every /api/admin/* path answers `401 { "error": "Unauthorized" }` without a valid token, even one that does not exist.
      Make a token with `npm run token -- --for <you>` in apps/server. Bodies use the fields in docs/DATABASE.md; dates are ISO 8601 strings.

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Server and database check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                  db: { const: ok }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/pages/home:
    get:
      tags: [Public]
      summary: "Home page: title and shown blocks, data blocks filled in"
      description: "Every data block arrives filled in (see Block)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [key, title, blocks]
                properties:
                  key: { type: string }
                  title: { type: string }
                  blocks: { type: array, items: { $ref: "#/components/schemas/Block" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects:
    get:
      tags: [Public]
      summary: Project bookshelf, newest first by start_date
      description: |
        The year filter and the reverse toggle run in the client.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProjectCard" } }

  /api/projects/{slug}:
    get:
      tags: [Public]
      summary: "Project page: fixed header and blocks"
      description: "Every data block arrives filled in (see Block)."
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  name: { type: string }
                  start_date: { $ref: "#/components/schemas/Date" }
                  end_date: { $ref: "#/components/schemas/DateOrNull" }
                  venue: { type: [string, "null"] }
                  pics: { $ref: "#/components/schemas/OnePic" }
                  is_yearbook_shown: { type: boolean }
                  blocks: { type: array, items: { $ref: "#/components/schemas/Block" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{slug}/yearbook:
    get:
      tags: [Public]
      summary: "Yearbook: shown team grouped by department"
      description: |
        Departments sorted by `dept_name`; members keep their order.
        `404` also when the project's yearbook is not shown.
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  name: { type: string }
                  pics: { $ref: "#/components/schemas/OnePic" }
                  departments: { type: array, items: { $ref: "#/components/schemas/Department" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tracks:
    get:
      tags: [Public]
      summary: Tracks (สายงาน) list, by order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    display_name: { type: string }
                    desc: { type: [string, "null"] }

  /api/tracks/{key}:
    get:
      tags: [Public]
      summary: Track popup
      description: |
        Achievements of hidden projects are left out.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, description: tracks.key }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  display_name: { type: string }
                  desc: { type: [string, "null"] }
                  pics: { type: array, items: { type: string, format: uri } }
                  achievements:
                    type: array
                    items:
                      type: object
                      properties:
                        year: { type: [integer, "null"] }
                        text: { type: string }
                        pics: { type: array, items: { type: string, format: uri } }
                        project_name: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/join:
    get:
      tags: [Public]
      summary: Open recruitment rounds, closing soonest first
      description: |
        Open = opens_at ≤ now ≤ (extended_to or closes_at). `[]` when none is open.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Round" } }


  # --- Admin (S6, S7): every route needs a token; hidden data is returned too ---
  /api/admin/projects:
    get:
      tags: [Admin]
      summary: List projects (hidden too)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "Every stored document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Admin]
      summary: Create a project
      security: [{ bearerAuth: [] }]
      description: "Changing slug renames it everywhere it is referenced; 409 if the new slug is taken."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "The whole document, fields as in docs/DATABASE.md (projects)" }
      responses:
        "201": { description: "The saved document, with _id" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/admin/projects/{slug}:
    get:
      tags: [Admin]
      summary: Get one project
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/slugKey" }]
      responses:
        "200": { description: "The stored document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Admin]
      summary: Replace a project
      security: [{ bearerAuth: [] }]
      description: "Changing slug renames it everywhere it is referenced; 409 if the new slug is taken."
      parameters: [{ $ref: "#/components/parameters/slugKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "The whole document" }
      responses:
        "200": { description: "The saved document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Admin]
      summary: Change some fields of a project
      security: [{ bearerAuth: [] }]
      description: "Merged into the stored document, then checked like a PUT. Changing slug renames it everywhere it is referenced; 409 if the new slug is taken."
      parameters: [{ $ref: "#/components/parameters/slugKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Only the fields to change" }
      responses:
        "200": { description: "The saved document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Admin]
      summary: Delete a project
      security: [{ bearerAuth: [] }]
      description: "409 while something still references it."
      parameters: [{ $ref: "#/components/parameters/slugKey" }]
      responses:
        "204": { description: "Deleted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
